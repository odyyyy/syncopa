services:
  frontend:
    container_name: frontend
    build: frontend/.
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules/
      - /frontend/public/assets:/frontend/public/assets
    restart: always
    ports:
      - "3000:3000"
    networks:
      - frontend-network

  backend:
    container_name: backend
    build: backend/.
    command: uv run uvicorn core.main:app --reload --host 0.0.0.0 --port 8000 
    restart: always
    volumes:
      - ./backend:/backend
    ports:
      - "8000:8000"
    networks:
      - frontend-network
      - backend-network
    depends_on:
      - postgres
    env_file:
      - .env

  postgres:
    container_name: postgres
    image: postgres:18-alpine
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - backend-network

volumes:
  db_data:

networks:
  frontend-network:
  backend-network:
